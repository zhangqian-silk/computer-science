<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 670" role="img" aria-labelledby="conversation-mobile-title conversation-mobile-desc" data-diagram="conversation-mobile">
<title id="conversation-mobile-title">多轮对话与历史续接</title><desc id="conversation-mobile-desc">两轮都由用户输入触发，历史只为第二轮提供信息，不自动发起下一轮。</desc><style>
svg{font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
.bg{fill:var(--diagram-bg,#fff)}
.node .shape{fill:var(--diagram-host,#f3f5f7);stroke:var(--diagram-stroke,#7e8794);stroke-width:1.5}
.node--model .shape{fill:var(--diagram-model,#eaf2fb);stroke:var(--diagram-model-stroke,#36678e);stroke-width:1.8}
.node--tool .shape{fill:var(--diagram-tool,#faf6ed);stroke:var(--diagram-tool-stroke,#9a8458);stroke-width:1.5;stroke-dasharray:5 3}
.node .label{fill:var(--diagram-ink,#24313e);font-weight:550;font-size:20px}
.node .role{fill:var(--diagram-muted,#596677);font-size:13px;letter-spacing:.6px}
.edge path{fill:none;stroke:var(--diagram-edge,#657485);stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.edge .edge-label{fill:var(--diagram-muted,#596677);font-size:16px;paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:5px;stroke-linejoin:round}
.note{fill:var(--diagram-muted,#596677);font-size:15px}
.lane{fill:var(--diagram-bg,#fff);stroke:var(--diagram-line,#cbd2da);stroke-width:1.4;stroke-dasharray:6 4}
.lane-title{fill:var(--diagram-ink,#24313e);font-size:19px;font-weight:600}
.bar{fill:var(--diagram-edge,#657485)}
.node.is-visited .shape{stroke:var(--diagram-active,#146957);stroke-width:2.2}
.node.is-current .shape{fill:var(--diagram-active-fill,#e1f3ec);stroke:var(--diagram-active,#146957);stroke-width:3.5}
.edge.is-visited path{stroke:var(--diagram-active,#146957);stroke-width:3}
.edge.is-current path{stroke:var(--diagram-active,#146957);stroke-width:3.8}
</style><defs><marker id="conversation-mobile-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="var(--diagram-edge,#657485)"/></marker></defs><rect class="bg" width="420" height="670"/><text class="lane-title" x="20" y="30" text-anchor="start" >第 1 轮：由用户输入触发</text><g class="node node--host" data-node="u1" id="conversation-mobile-node-u1"><rect class="shape" x="18" y="68" width="173" height="64" rx="4"/><text class="role" x="104.5" y="88" text-anchor="middle">输入</text><text class="label" style="font-size:18px" x="104.5" y="114.68" text-anchor="middle">用户问题</text></g><g class="node node--host" data-node="c1" id="conversation-mobile-node-c1"><rect class="shape" x="231" y="68" width="173" height="64" rx="4"/><text class="role" x="317.5" y="88" text-anchor="middle">程序</text><text class="label" style="font-size:18px" x="317.5" y="114.68" text-anchor="middle">组装输入</text></g><g class="node node--model" data-node="m1" id="conversation-mobile-node-m1"><rect class="shape" x="231" y="172" width="173" height="64" rx="15"/><text class="role" x="317.5" y="192" text-anchor="middle">LLM</text><text class="label" style="font-size:18px" x="317.5" y="218.67999999999998" text-anchor="middle">生成回答</text></g><g class="node node--host" data-node="history" id="conversation-mobile-node-history"><rect class="shape" x="90" y="284" width="240" height="64" rx="4"/><text class="role" x="210.0" y="304" text-anchor="middle">会话状态</text><text class="label" style="font-size:19px" x="210.0" y="330.94" text-anchor="middle">保存本轮历史</text></g><g class="edge" data-edge="u1-c1" id="conversation-mobile-edge-u1-c1"><path d="M191 100 H231" marker-end="url(#conversation-mobile-arrow)"/></g><g class="edge" data-edge="c1-m1" id="conversation-mobile-edge-c1-m1"><path d="M317 132 V172" marker-end="url(#conversation-mobile-arrow)"/></g><g class="edge" data-edge="save" id="conversation-mobile-edge-save"><path d="M317 236 V263 H210 V284" marker-end="url(#conversation-mobile-arrow)"/></g><path d="M14 389 H406" stroke="var(--diagram-line,#cbd2da)" stroke-dasharray="5 5"/><text class="note" x="210" y="380" text-anchor="middle" style="font-size:16px">等待用户追问，不自动启动下一轮</text><text class="lane-title" x="20" y="430" text-anchor="start" >第 2 轮：由新的输入触发</text><g class="node node--host" data-node="u2" id="conversation-mobile-node-u2"><rect class="shape" x="18" y="466" width="173" height="64" rx="4"/><text class="role" x="104.5" y="486" text-anchor="middle">输入</text><text class="label" style="font-size:18px" x="104.5" y="512.68" text-anchor="middle">用户追问</text></g><g class="node node--host" data-node="c2" id="conversation-mobile-node-c2"><rect class="shape" x="231" y="466" width="173" height="64" rx="4"/><text class="role" x="317.5" y="486" text-anchor="middle">程序</text><text class="label" style="font-size:18px" x="317.5" y="512.68" text-anchor="middle">历史＋新问题</text></g><g class="node node--model" data-node="m2" id="conversation-mobile-node-m2"><rect class="shape" x="231" y="577" width="173" height="64" rx="15"/><text class="role" x="317.5" y="597" text-anchor="middle">LLM</text><text class="label" style="font-size:18px" x="317.5" y="623.6800000000001" text-anchor="middle">继续回答</text></g><g class="node node--host" data-node="return" id="conversation-mobile-node-return"><rect class="shape" x="18" y="577" width="173" height="64" rx="4"/><text class="role" x="104.5" y="597" text-anchor="middle">程序</text><text class="label" style="font-size:18px" x="104.5" y="623.6800000000001" text-anchor="middle">展示回答</text></g><g class="edge" data-edge="u2-c2" id="conversation-mobile-edge-u2-c2"><path d="M191 498 H231" marker-end="url(#conversation-mobile-arrow)"/></g><g class="edge" data-edge="history" id="conversation-mobile-edge-history"><path d="M330 315 H415 V450 H317 V466" marker-end="url(#conversation-mobile-arrow)"/></g><g class="edge" data-edge="c2-m2" id="conversation-mobile-edge-c2-m2"><path d="M317 530 V577" marker-end="url(#conversation-mobile-arrow)"/></g><g class="edge" data-edge="return" id="conversation-mobile-edge-return"><path d="M231 609 H191" marker-end="url(#conversation-mobile-arrow)"/></g></svg>