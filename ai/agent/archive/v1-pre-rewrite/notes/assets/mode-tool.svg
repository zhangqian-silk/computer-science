<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 620" role="img" aria-labelledby="mode-tool-title mode-tool-desc" data-diagram="mode-tool">
<title id="mode-tool-title">单次工具执行</title><desc id="mode-tool-desc">模型只负责选择一个工具和参数。程序按调用名称分派至一个已授权工具，执行后直接返回，不把结果再次发给模型。两条工具路径是互斥选择，不是并行。</desc><style>
svg{font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
.bg{fill:var(--diagram-bg,#fff)}
.node .shape{fill:var(--diagram-host,#f3f5f7);stroke:var(--diagram-stroke,#7e8794);stroke-width:1.5}
.node--model .shape{fill:var(--diagram-model,#eaf2fb);stroke:var(--diagram-model-stroke,#36678e);stroke-width:1.8}
.node--tool .shape{fill:var(--diagram-tool,#faf6ed);stroke:var(--diagram-tool-stroke,#9a8458);stroke-width:1.5;stroke-dasharray:5 3}
.node .label{fill:var(--diagram-ink,#24313e);font-weight:550;font-size:20px}
.node .role{fill:var(--diagram-muted,#596677);font-size:13px;letter-spacing:.6px}
.edge path{fill:none;stroke:var(--diagram-edge,#657485);stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.edge .edge-label{fill:var(--diagram-muted,#596677);font-size:16px;paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:5px;stroke-linejoin:round}
.note{fill:var(--diagram-muted,#596677);font-size:15px}
.lane{fill:var(--diagram-bg,#fff);stroke:var(--diagram-line,#cbd2da);stroke-width:1.4;stroke-dasharray:6 4}
.lane-title{fill:var(--diagram-ink,#24313e);font-size:19px;font-weight:600}
.bar{fill:var(--diagram-edge,#657485)}
.node.is-visited .shape{stroke:var(--diagram-active,#146957);stroke-width:2.2}
.node.is-current .shape{fill:var(--diagram-active-fill,#e1f3ec);stroke:var(--diagram-active,#146957);stroke-width:3.5}
.edge.is-visited path{stroke:var(--diagram-active,#146957);stroke-width:3}
.edge.is-current path{stroke:var(--diagram-active,#146957);stroke-width:3.8}
</style><defs><marker id="mode-tool-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="var(--diagram-edge,#657485)"/></marker></defs><rect class="bg" width="520" height="620"/><g class="node node--host" data-node="input" id="mode-tool-node-input"><rect class="shape" x="135" y="18" width="250" height="60" rx="4"/><text class="role" x="260.0" y="38" text-anchor="middle">程序</text><text class="label" style="font-size:20px" x="260.0" y="63.2" text-anchor="middle">问题与工具说明</text></g><g class="node node--model" data-node="model" id="mode-tool-node-model"><rect class="shape" x="145" y="121" width="230" height="74" rx="15"/><text class="role" x="260.0" y="141" text-anchor="middle">LLM × 1</text><text class="label" style="font-size:20px" x="260.0" y="173.2" text-anchor="middle">选择工具与参数</text></g><g class="node node--host" data-node="dispatch" id="mode-tool-node-dispatch"><polygon class="shape" points="260,233.0 352.0,285 260,337.0 168.0,285"/><text class="label" style="font-size:17px" x="260" y="280" text-anchor="middle">校验并按名称</text><text class="label" style="font-size:17px" x="260" y="302" text-anchor="middle">分派一个工具</text></g><g class="node node--tool" data-node="order" id="mode-tool-node-order"><rect class="shape" x="20" y="391" width="212" height="82" rx="4"/><text class="role" x="126.0" y="411" text-anchor="middle">工具 A</text><text class="label" style="font-size:20px" x="126.0" y="447.2" text-anchor="middle">查询订单</text></g><g class="node node--tool" data-node="shipment" id="mode-tool-node-shipment"><rect class="shape" x="288" y="391" width="212" height="82" rx="4"/><text class="role" x="394.0" y="411" text-anchor="middle">工具 B</text><text class="label" style="font-size:20px" x="394.0" y="447.2" text-anchor="middle">查询物流</text></g><g class="node node--host" data-node="return" id="mode-tool-node-return"><rect class="shape" x="135" y="543" width="250" height="60" rx="4"/><text class="role" x="260.0" y="563" text-anchor="middle">程序</text><text class="label" style="font-size:20px" x="260.0" y="588.2" text-anchor="middle">直接展示工具结果</text></g><g class="edge" data-edge="ask" id="mode-tool-edge-ask"><path d="M260 78 V121" marker-end="url(#mode-tool-arrow)"/></g><g class="edge" data-edge="propose" id="mode-tool-edge-propose"><path d="M260 195 V233" marker-end="url(#mode-tool-arrow)"/></g><g class="edge" data-edge="choose-order" id="mode-tool-edge-choose-order"><path d="M168 285 H126 V391" marker-end="url(#mode-tool-arrow)"/><text class="edge-label" x="117" y="315" text-anchor="middle">选 A</text></g><g class="edge" data-edge="choose-shipment" id="mode-tool-edge-choose-shipment"><path d="M352 285 H394 V391" marker-end="url(#mode-tool-arrow)"/><text class="edge-label" x="401" y="315" text-anchor="middle">选 B</text></g><g class="edge" data-edge="return-order" id="mode-tool-edge-return-order"><path d="M126 473 V510 H225 V543" marker-end="url(#mode-tool-arrow)"/></g><g class="edge" data-edge="return-shipment" id="mode-tool-edge-return-shipment"><path d="M394 473 V510 H295 V543" marker-end="url(#mode-tool-arrow)"/></g></svg>