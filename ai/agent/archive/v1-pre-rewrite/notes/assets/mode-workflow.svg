<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 650" role="img" aria-labelledby="mode-workflow-title mode-workflow-desc" data-diagram="mode-workflow">
<title id="mode-workflow-title">预定义工作流</title><desc id="mode-workflow-desc">代码规定抽取订单号、校验、并行查询订单与时效、汇总生成的流程。订单号无效时走预定义澄清分支；独立的两个工具可以并行。分支、并行与重试不意味着自主 Agent。</desc><style>
svg{font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
.bg{fill:var(--diagram-bg,#fff)}
.node .shape{fill:var(--diagram-host,#f3f5f7);stroke:var(--diagram-stroke,#7e8794);stroke-width:1.5}
.node--model .shape{fill:var(--diagram-model,#eaf2fb);stroke:var(--diagram-model-stroke,#36678e);stroke-width:1.8}
.node--tool .shape{fill:var(--diagram-tool,#faf6ed);stroke:var(--diagram-tool-stroke,#9a8458);stroke-width:1.5;stroke-dasharray:5 3}
.node .label{fill:var(--diagram-ink,#24313e);font-weight:550;font-size:20px}
.node .role{fill:var(--diagram-muted,#596677);font-size:13px;letter-spacing:.6px}
.edge path{fill:none;stroke:var(--diagram-edge,#657485);stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.edge .edge-label{fill:var(--diagram-muted,#596677);font-size:16px;paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:5px;stroke-linejoin:round}
.note{fill:var(--diagram-muted,#596677);font-size:15px}
.lane{fill:var(--diagram-bg,#fff);stroke:var(--diagram-line,#cbd2da);stroke-width:1.4;stroke-dasharray:6 4}
.lane-title{fill:var(--diagram-ink,#24313e);font-size:19px;font-weight:600}
.bar{fill:var(--diagram-edge,#657485)}
.node.is-visited .shape{stroke:var(--diagram-active,#146957);stroke-width:2.2}
.node.is-current .shape{fill:var(--diagram-active-fill,#e1f3ec);stroke:var(--diagram-active,#146957);stroke-width:3.5}
.edge.is-visited path{stroke:var(--diagram-active,#146957);stroke-width:3}
.edge.is-current path{stroke:var(--diagram-active,#146957);stroke-width:3.8}
</style><defs><marker id="mode-workflow-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="var(--diagram-edge,#657485)"/></marker></defs><rect class="bg" width="520" height="650"/><g class="node node--host" data-node="input" id="mode-workflow-node-input"><rect class="shape" x="160" y="10" width="200" height="54" rx="4"/><text class="role" x="260.0" y="30" text-anchor="middle">程序</text><text class="label" style="font-size:20px" x="260.0" y="52.2" text-anchor="middle">用户请求</text></g><g class="node node--model" data-node="extract" id="mode-workflow-node-extract"><rect class="shape" x="145" y="103" width="230" height="65" rx="15"/><text class="role" x="260.0" y="123" text-anchor="middle">LLM · 节点 1</text><text class="label" style="font-size:20px" x="260.0" y="150.7" text-anchor="middle">抽取订单号</text></g><g class="node node--host" data-node="valid" id="mode-workflow-node-valid"><polygon class="shape" points="260,197.0 329.0,240 260,283.0 191.0,240"/><text class="label" style="font-size:17px" x="260" y="235" text-anchor="middle">订单号</text><text class="label" style="font-size:17px" x="260" y="257" text-anchor="middle">有效？</text></g><g class="node node--host" data-node="clarify" id="mode-workflow-node-clarify"><rect class="shape" x="392" y="210" width="117" height="62" rx="4"/><text class="role" x="450.5" y="230" text-anchor="middle">程序</text><text class="label" style="font-size:18px" x="450.5" y="255.67999999999998" text-anchor="middle">请求补充</text></g><g class="node" data-node="fork"><rect class="bar" x="118" y="327" width="282" height="5" rx="2"/></g><g class="node node--tool" data-node="order" id="mode-workflow-node-order"><rect class="shape" x="16" y="374" width="220" height="70" rx="4"/><text class="role" x="126.0" y="394" text-anchor="middle">工具 · 并行 A</text><text class="label" style="font-size:20px" x="126.0" y="424.2" text-anchor="middle">查询订单</text></g><g class="node node--tool" data-node="sla" id="mode-workflow-node-sla"><rect class="shape" x="284" y="374" width="220" height="70" rx="4"/><text class="role" x="394.0" y="394" text-anchor="middle">工具 · 并行 B</text><text class="label" style="font-size:20px" x="394.0" y="424.2" text-anchor="middle">查询配送时效</text></g><g class="node" data-node="join"><rect class="bar" x="118" y="489" width="282" height="5" rx="2"/></g><g class="node node--model" data-node="summarize" id="mode-workflow-node-summarize"><rect class="shape" x="145" y="529" width="230" height="65" rx="15"/><text class="role" x="260.0" y="549" text-anchor="middle">LLM · 节点 2</text><text class="label" style="font-size:20px" x="260.0" y="576.7" text-anchor="middle">汇总并生成说明</text></g><g class="edge" data-edge="ask" id="mode-workflow-edge-ask"><path d="M260 64 V103" marker-end="url(#mode-workflow-arrow)"/></g><g class="edge" data-edge="check" id="mode-workflow-edge-check"><path d="M260 168 V197" marker-end="url(#mode-workflow-arrow)"/></g><g class="edge" data-edge="no" id="mode-workflow-edge-no"><path d="M329 240 H392" marker-end="url(#mode-workflow-arrow)"/><text class="edge-label" x="361" y="226" text-anchor="middle">否</text></g><g class="edge" data-edge="yes" id="mode-workflow-edge-yes"><path d="M260 283 V327" marker-end="url(#mode-workflow-arrow)"/><text class="edge-label" x="278" y="307" text-anchor="middle">是</text></g><g class="edge" data-edge="fork-a" id="mode-workflow-edge-fork-a"><path d="M126 332 V374" marker-end="url(#mode-workflow-arrow)"/></g><g class="edge" data-edge="fork-b" id="mode-workflow-edge-fork-b"><path d="M394 332 V374" marker-end="url(#mode-workflow-arrow)"/></g><g class="edge" data-edge="join-a" id="mode-workflow-edge-join-a"><path d="M126 444 V489" marker-end="url(#mode-workflow-arrow)"/></g><g class="edge" data-edge="join-b" id="mode-workflow-edge-join-b"><path d="M394 444 V489" marker-end="url(#mode-workflow-arrow)"/></g><g class="edge" data-edge="summarize" id="mode-workflow-edge-summarize"><path d="M260 494 V529" marker-end="url(#mode-workflow-arrow)"/></g><g class="edge" data-edge="deliver" id="mode-workflow-edge-deliver"><path d="M260 594 V627" marker-end="url(#mode-workflow-arrow)"/></g><text class="note" x="260" y="647" text-anchor="middle" >程序交付结果</text><text class="note" x="260" y="357" text-anchor="middle" >同时执行</text><text class="note" x="260" y="474" text-anchor="middle" >等待两项结果</text></svg>