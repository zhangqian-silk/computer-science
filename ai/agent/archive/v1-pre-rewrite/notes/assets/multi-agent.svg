<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 525" role="img" aria-labelledby="multi-agent-title multi-agent-desc" data-diagram="multi-agent">
<title id="multi-agent-title">多 Agent 的并行委派</title><desc id="multi-agent-desc">协调者向两个具有独立上下文的 Agent 委派工作，每个 Agent 内部可以运行自己的模型与工具反馈循环。最终由协调程序汇总结果并验证；控制者可以是固定程序或主 Agent。</desc><style>
svg{font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
.bg{fill:var(--diagram-bg,#fff)}
.node .shape{fill:var(--diagram-host,#f3f5f7);stroke:var(--diagram-stroke,#7e8794);stroke-width:1.5}
.node--model .shape{fill:var(--diagram-model,#eaf2fb);stroke:var(--diagram-model-stroke,#36678e);stroke-width:1.8}
.node--tool .shape{fill:var(--diagram-tool,#faf6ed);stroke:var(--diagram-tool-stroke,#9a8458);stroke-width:1.5;stroke-dasharray:5 3}
.node .label{fill:var(--diagram-ink,#24313e);font-weight:550;font-size:20px}
.node .role{fill:var(--diagram-muted,#596677);font-size:13px;letter-spacing:.6px}
.edge path{fill:none;stroke:var(--diagram-edge,#657485);stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.edge .edge-label{fill:var(--diagram-muted,#596677);font-size:16px;paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:5px;stroke-linejoin:round}
.note{fill:var(--diagram-muted,#596677);font-size:15px}
.lane{fill:var(--diagram-bg,#fff);stroke:var(--diagram-line,#cbd2da);stroke-width:1.4;stroke-dasharray:6 4}
.lane-title{fill:var(--diagram-ink,#24313e);font-size:19px;font-weight:600}
.bar{fill:var(--diagram-edge,#657485)}
.node.is-visited .shape{stroke:var(--diagram-active,#146957);stroke-width:2.2}
.node.is-current .shape{fill:var(--diagram-active-fill,#e1f3ec);stroke:var(--diagram-active,#146957);stroke-width:3.5}
.edge.is-visited path{stroke:var(--diagram-active,#146957);stroke-width:3}
.edge.is-current path{stroke:var(--diagram-active,#146957);stroke-width:3.8}
</style><defs><marker id="multi-agent-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="var(--diagram-edge,#657485)"/></marker></defs><rect class="bg" width="900" height="525"/><g class="node node--host" data-node="coordinator" id="multi-agent-node-coordinator"><rect class="shape" x="300" y="18" width="300" height="70" rx="4"/><text class="role" x="450.0" y="38" text-anchor="middle">程序或主 Agent</text><text class="label" style="font-size:20px" x="450.0" y="68.2" text-anchor="middle">拆分与委派</text></g><rect class="lane" x="20" y="160" width="405" height="224" rx="7"/><text class="lane-title" x="38" y="189" text-anchor="start" >Agent A · 独立上下文</text><rect class="lane" x="475" y="160" width="405" height="224" rx="7"/><text class="lane-title" x="493" y="189" text-anchor="start" >Agent B · 独立上下文</text><g class="node node--model" data-node="a-model" id="multi-agent-node-a-model"><rect class="shape" x="45" y="221" width="155" height="65" rx="15"/><text class="role" x="122.5" y="241" text-anchor="middle">LLM</text><text class="label" style="font-size:19px" x="122.5" y="268.44" text-anchor="middle">选择动作</text></g><g class="node node--tool" data-node="a-tool" id="multi-agent-node-a-tool"><rect class="shape" x="252" y="221" width="150" height="65" rx="4"/><text class="role" x="327.0" y="241" text-anchor="middle">工具</text><text class="label" style="font-size:19px" x="327.0" y="268.44" text-anchor="middle">执行工具</text></g><g class="edge" data-edge="a-call" id="multi-agent-edge-a-call"><path d="M200 254 H252" marker-end="url(#multi-agent-arrow)"/></g><g class="edge" data-edge="a-feedback" id="multi-agent-edge-a-feedback"><path d="M327 286 V337 H122 V286" marker-end="url(#multi-agent-arrow)"/><text class="edge-label" x="224" y="331" text-anchor="middle">观察结果</text></g><g class="node node--model" data-node="b-model" id="multi-agent-node-b-model"><rect class="shape" x="500" y="221" width="155" height="65" rx="15"/><text class="role" x="577.5" y="241" text-anchor="middle">LLM</text><text class="label" style="font-size:19px" x="577.5" y="268.44" text-anchor="middle">选择动作</text></g><g class="node node--tool" data-node="b-tool" id="multi-agent-node-b-tool"><rect class="shape" x="707" y="221" width="150" height="65" rx="4"/><text class="role" x="782.0" y="241" text-anchor="middle">工具</text><text class="label" style="font-size:19px" x="782.0" y="268.44" text-anchor="middle">执行工具</text></g><g class="edge" data-edge="b-call" id="multi-agent-edge-b-call"><path d="M655 254 H707" marker-end="url(#multi-agent-arrow)"/></g><g class="edge" data-edge="b-feedback" id="multi-agent-edge-b-feedback"><path d="M782 286 V337 H577 V286" marker-end="url(#multi-agent-arrow)"/><text class="edge-label" x="679" y="331" text-anchor="middle">观察结果</text></g><g class="node node--host" data-node="integrate" id="multi-agent-node-integrate"><rect class="shape" x="300" y="446" width="300" height="68" rx="4"/><text class="role" x="450.0" y="466" text-anchor="middle">程序</text><text class="label" style="font-size:20px" x="450.0" y="495.2" text-anchor="middle">汇总结果与全局验证</text></g><g class="edge" data-edge="delegate-a" id="multi-agent-edge-delegate-a"><path d="M368 88 V122 H222 V160" marker-end="url(#multi-agent-arrow)"/><text class="edge-label" x="248" y="112" text-anchor="middle">子任务 A</text></g><g class="edge" data-edge="delegate-b" id="multi-agent-edge-delegate-b"><path d="M532 88 V122 H678 V160" marker-end="url(#multi-agent-arrow)"/><text class="edge-label" x="652" y="112" text-anchor="middle">子任务 B</text></g><g class="edge" data-edge="result-a" id="multi-agent-edge-result-a"><path d="M222 384 V416 H372 V446" marker-end="url(#multi-agent-arrow)"/><text class="edge-label" x="267" y="406" text-anchor="middle">结果 A</text></g><g class="edge" data-edge="result-b" id="multi-agent-edge-result-b"><path d="M678 384 V416 H528 V446" marker-end="url(#multi-agent-arrow)"/><text class="edge-label" x="632" y="406" text-anchor="middle">结果 B</text></g></svg>