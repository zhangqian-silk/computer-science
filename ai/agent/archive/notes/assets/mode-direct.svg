<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 620" role="img" aria-labelledby="mode-direct-title mode-direct-desc" data-diagram="mode-direct">
<title id="mode-direct-title">单次生成</title><desc id="mode-direct-desc">程序提供已有资料，调用一次模型，处理文本或结构化结果后结束。图中没有工具执行，也没有返回模型的反馈边。</desc><style>
svg{font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
.bg{fill:var(--diagram-bg,#fff)}
.node .shape{fill:var(--diagram-host,#f3f5f7);stroke:var(--diagram-stroke,#7e8794);stroke-width:1.5}
.node--model .shape{fill:var(--diagram-model,#eaf2fb);stroke:var(--diagram-model-stroke,#36678e);stroke-width:1.8}
.node--tool .shape{fill:var(--diagram-tool,#faf6ed);stroke:var(--diagram-tool-stroke,#9a8458);stroke-width:1.5;stroke-dasharray:5 3}
.node .label{fill:var(--diagram-ink,#24313e);font-weight:550;font-size:20px}
.node .role{fill:var(--diagram-muted,#596677);font-size:13px;letter-spacing:.6px}
.edge path{fill:none;stroke:var(--diagram-edge,#657485);stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.edge .edge-label{fill:var(--diagram-muted,#596677);font-size:16px;paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:5px;stroke-linejoin:round}
.note{fill:var(--diagram-muted,#596677);font-size:15px}
.lane{fill:var(--diagram-bg,#fff);stroke:var(--diagram-line,#cbd2da);stroke-width:1.4;stroke-dasharray:6 4}
.lane-title{fill:var(--diagram-ink,#24313e);font-size:19px;font-weight:600}
.bar{fill:var(--diagram-edge,#657485)}
.node.is-visited .shape{stroke:var(--diagram-active,#146957);stroke-width:2.2}
.node.is-current .shape{fill:var(--diagram-active-fill,#e1f3ec);stroke:var(--diagram-active,#146957);stroke-width:3.5}
.edge.is-visited path{stroke:var(--diagram-active,#146957);stroke-width:3}
.edge.is-current path{stroke:var(--diagram-active,#146957);stroke-width:3.8}
</style><defs><marker id="mode-direct-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="var(--diagram-edge,#657485)"/></marker></defs><rect class="bg" width="520" height="620"/><g class="node node--host" data-node="input" id="mode-direct-node-input"><rect class="shape" x="125" y="35" width="270" height="72" rx="4"/><text class="role" x="260.0" y="55" text-anchor="middle">程序</text><text class="label" style="font-size:20px" x="260.0" y="86.2" text-anchor="middle">问题与已有资料</text></g><g class="node node--model" data-node="model" id="mode-direct-node-model"><rect class="shape" x="150" y="193" width="220" height="82" rx="15"/><text class="role" x="260.0" y="213" text-anchor="middle">LLM × 1</text><text class="label" style="font-size:20px" x="260.0" y="249.2" text-anchor="middle">生成回答</text></g><g class="node node--host" data-node="format" id="mode-direct-node-format"><rect class="shape" x="125" y="360" width="270" height="72" rx="4"/><text class="role" x="260.0" y="380" text-anchor="middle">程序</text><text class="label" style="font-size:20px" x="260.0" y="411.2" text-anchor="middle">校验或格式化输出</text></g><g class="node node--host" data-node="return" id="mode-direct-node-return"><rect class="shape" x="150" y="528" width="220" height="60" rx="4"/><text class="role" x="260.0" y="548" text-anchor="middle">程序</text><text class="label" style="font-size:20px" x="260.0" y="573.2" text-anchor="middle">返回结果</text></g><g class="edge" data-edge="ask" id="mode-direct-edge-ask"><path d="M260 107 V193" marker-end="url(#mode-direct-arrow)"/><text class="edge-label" x="292" y="157" text-anchor="middle">请求</text></g><g class="edge" data-edge="answer" id="mode-direct-edge-answer"><path d="M260 275 V360" marker-end="url(#mode-direct-arrow)"/><text class="edge-label" x="292" y="322" text-anchor="middle">响应</text></g><g class="edge" data-edge="deliver" id="mode-direct-edge-deliver"><path d="M260 432 V528" marker-end="url(#mode-direct-arrow)"/></g></svg>