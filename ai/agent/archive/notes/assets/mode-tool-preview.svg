<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" role="img" aria-labelledby="mode-tool-preview-title mode-tool-preview-desc" data-diagram="mode-tool-preview">
<title id="mode-tool-preview-title">单次工具执行：按名称选一条工具路径</title><desc id="mode-tool-preview-desc">模型输出工具名称和参数，程序选择一个工具执行，直接返回。</desc><style>
svg{font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
.bg{fill:var(--diagram-bg,#fff)}
.node .shape{fill:var(--diagram-host,#f3f5f7);stroke:var(--diagram-stroke,#7e8794);stroke-width:1.5}
.node--model .shape{fill:var(--diagram-model,#eaf2fb);stroke:var(--diagram-model-stroke,#36678e);stroke-width:1.8}
.node--tool .shape{fill:var(--diagram-tool,#faf6ed);stroke:var(--diagram-tool-stroke,#9a8458);stroke-width:1.5;stroke-dasharray:5 3}
.node .label{fill:var(--diagram-ink,#24313e);font-weight:550;font-size:20px}
.node .role{fill:var(--diagram-muted,#596677);font-size:13px;letter-spacing:.6px}
.edge path{fill:none;stroke:var(--diagram-edge,#657485);stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.edge .edge-label{fill:var(--diagram-muted,#596677);font-size:16px;paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:5px;stroke-linejoin:round}
.note{fill:var(--diagram-muted,#596677);font-size:15px}
.lane{fill:var(--diagram-bg,#fff);stroke:var(--diagram-line,#cbd2da);stroke-width:1.4;stroke-dasharray:6 4}
.lane-title{fill:var(--diagram-ink,#24313e);font-size:19px;font-weight:600}
.bar{fill:var(--diagram-edge,#657485)}
.node.is-visited .shape{stroke:var(--diagram-active,#146957);stroke-width:2.2}
.node.is-current .shape{fill:var(--diagram-active-fill,#e1f3ec);stroke:var(--diagram-active,#146957);stroke-width:3.5}
.edge.is-visited path{stroke:var(--diagram-active,#146957);stroke-width:3}
.edge.is-current path{stroke:var(--diagram-active,#146957);stroke-width:3.8}
</style><defs><marker id="mode-tool-preview-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="var(--diagram-edge,#657485)"/></marker></defs><rect class="bg" width="440" height="300"/><g class="node node--model" data-node="model" id="mode-tool-preview-node-model"><rect class="shape" x="133" y="15" width="174" height="61" rx="15"/><text class="role" x="220.0" y="35" text-anchor="middle">LLM × 1</text><text class="label" style="font-size:18px" x="220.0" y="60.18000000000001" text-anchor="middle">选择工具与参数</text></g><g class="node node--host" data-node="dispatch" id="mode-tool-preview-node-dispatch"><polygon class="shape" points="220,103.0 272.0,135 220,167.0 168.0,135"/><text class="label" style="font-size:17px" x="220" y="130" text-anchor="middle">校验与</text><text class="label" style="font-size:17px" x="220" y="152" text-anchor="middle">分派</text></g><g class="node node--tool" data-node="order" id="mode-tool-preview-node-order"><rect class="shape" x="18" y="197" width="158" height="55" rx="4"/><text class="role" x="97.0" y="217" text-anchor="middle">工具 A</text><text class="label" style="font-size:18px" x="97.0" y="239.17999999999998" text-anchor="middle">查询订单</text></g><g class="node node--tool" data-node="shipment" id="mode-tool-preview-node-shipment"><rect class="shape" x="264" y="197" width="158" height="55" rx="4"/><text class="role" x="343.0" y="217" text-anchor="middle">工具 B</text><text class="label" style="font-size:18px" x="343.0" y="239.17999999999998" text-anchor="middle">查询物流</text></g><g class="edge" data-edge="propose" id="mode-tool-preview-edge-propose"><path d="M220 76 V103" marker-end="url(#mode-tool-preview-arrow)"/></g><g class="edge" data-edge="a" id="mode-tool-preview-edge-a"><path d="M168 135 H97 V197" marker-end="url(#mode-tool-preview-arrow)"/><text class="edge-label" x="111" y="176" text-anchor="middle">选 A</text></g><g class="edge" data-edge="b" id="mode-tool-preview-edge-b"><path d="M272 135 H343 V197" marker-end="url(#mode-tool-preview-arrow)"/><text class="edge-label" x="329" y="176" text-anchor="middle">选 B</text></g><g class="edge" data-edge="ra" id="mode-tool-preview-edge-ra"><path d="M97 252 V279 H192" marker-end="url(#mode-tool-preview-arrow)"/></g><g class="edge" data-edge="rb" id="mode-tool-preview-edge-rb"><path d="M343 252 V279 H248" marker-end="url(#mode-tool-preview-arrow)"/></g><text class="lane-title" x="220" y="287" text-anchor="middle" >返回</text></svg>