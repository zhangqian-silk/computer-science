<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 335" role="img" aria-labelledby="mode-workflow-preview-title mode-workflow-preview-desc" data-diagram="mode-workflow-preview">
<title id="mode-workflow-preview-title">Workflow：预定义分支与并行</title><desc id="mode-workflow-preview-desc">程序预先定义校验分支、工具并行与汇总节点，模型不逐轮决定后续路径。</desc><style>
svg{font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
.bg{fill:var(--diagram-bg,#fff)}
.node .shape{fill:var(--diagram-host,#f3f5f7);stroke:var(--diagram-stroke,#7e8794);stroke-width:1.5}
.node--model .shape{fill:var(--diagram-model,#eaf2fb);stroke:var(--diagram-model-stroke,#36678e);stroke-width:1.8}
.node--tool .shape{fill:var(--diagram-tool,#faf6ed);stroke:var(--diagram-tool-stroke,#9a8458);stroke-width:1.5;stroke-dasharray:5 3}
.node .label{fill:var(--diagram-ink,#24313e);font-weight:550;font-size:20px}
.node .role{fill:var(--diagram-muted,#596677);font-size:13px;letter-spacing:.6px}
.edge path{fill:none;stroke:var(--diagram-edge,#657485);stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.edge .edge-label{fill:var(--diagram-muted,#596677);font-size:16px;paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:5px;stroke-linejoin:round}
.note{fill:var(--diagram-muted,#596677);font-size:15px}
.lane{fill:var(--diagram-bg,#fff);stroke:var(--diagram-line,#cbd2da);stroke-width:1.4;stroke-dasharray:6 4}
.lane-title{fill:var(--diagram-ink,#24313e);font-size:19px;font-weight:600}
.bar{fill:var(--diagram-edge,#657485)}
.node.is-visited .shape{stroke:var(--diagram-active,#146957);stroke-width:2.2}
.node.is-current .shape{fill:var(--diagram-active-fill,#e1f3ec);stroke:var(--diagram-active,#146957);stroke-width:3.5}
.edge.is-visited path{stroke:var(--diagram-active,#146957);stroke-width:3}
.edge.is-current path{stroke:var(--diagram-active,#146957);stroke-width:3.8}
</style><defs><marker id="mode-workflow-preview-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="var(--diagram-edge,#657485)"/></marker></defs><rect class="bg" width="440" height="335"/><g class="node node--model" data-node="extract" id="mode-workflow-preview-node-extract"><rect class="shape" x="135" y="8" width="170" height="52" rx="15"/><text class="role" x="220.0" y="28" text-anchor="middle">LLM · 节点 1</text><text class="label" style="font-size:17px" x="220.0" y="48.419999999999995" text-anchor="middle">抽取订单号</text></g><g class="node node--host" data-node="valid" id="mode-workflow-preview-node-valid"><polygon class="shape" points="220,82.0 265.0,114 220,146.0 175.0,114"/><text class="label" style="font-size:17px" x="220" y="120" text-anchor="middle">有效？</text></g><g class="node node--host" data-node="clarify" id="mode-workflow-preview-node-clarify"><rect class="shape" x="331" y="87" width="95" height="53" rx="4"/><text class="role" x="378.5" y="107" text-anchor="middle">程序</text><text class="label" style="font-size:16px" x="378.5" y="127.66000000000001" text-anchor="middle">补充输入</text></g><g class="node" data-node="fork"><rect class="bar" x="91" y="172" width="259" height="5" rx="2"/></g><g class="node node--tool" data-node="order" id="mode-workflow-preview-node-order"><rect class="shape" x="17" y="201" width="162" height="57" rx="4"/><text class="role" x="98.0" y="221" text-anchor="middle">工具 A</text><text class="label" style="font-size:17px" x="98.0" y="243.92000000000002" text-anchor="middle">查询订单</text></g><g class="node node--tool" data-node="sla" id="mode-workflow-preview-node-sla"><rect class="shape" x="261" y="201" width="162" height="57" rx="4"/><text class="role" x="342.0" y="221" text-anchor="middle">工具 B</text><text class="label" style="font-size:17px" x="342.0" y="243.92000000000002" text-anchor="middle">查询时效</text></g><g class="node" data-node="join"><rect class="bar" x="91" y="281" width="259" height="5" rx="2"/></g><g class="node node--model" data-node="summarize" id="mode-workflow-preview-node-summarize"><rect class="shape" x="138" y="306" width="164" height="28" rx="15"/><text class="label" style="font-size:16px" x="220.0" y="324.79999999999995" text-anchor="middle">LLM 汇总结果</text></g><g class="edge" data-edge="check" id="mode-workflow-preview-edge-check"><path d="M220 60 V82" marker-end="url(#mode-workflow-preview-arrow)"/></g><g class="edge" data-edge="no" id="mode-workflow-preview-edge-no"><path d="M265 114 H331" marker-end="url(#mode-workflow-preview-arrow)"/><text class="edge-label" x="299" y="101" text-anchor="middle">否</text></g><g class="edge" data-edge="yes" id="mode-workflow-preview-edge-yes"><path d="M220 146 V172" marker-end="url(#mode-workflow-preview-arrow)"/><text class="edge-label" x="240" y="162" text-anchor="middle">是</text></g><g class="edge" data-edge="fa" id="mode-workflow-preview-edge-fa"><path d="M98 177 V201" marker-end="url(#mode-workflow-preview-arrow)"/></g><g class="edge" data-edge="fb" id="mode-workflow-preview-edge-fb"><path d="M342 177 V201" marker-end="url(#mode-workflow-preview-arrow)"/></g><g class="edge" data-edge="ja" id="mode-workflow-preview-edge-ja"><path d="M98 258 V281" marker-end="url(#mode-workflow-preview-arrow)"/></g><g class="edge" data-edge="jb" id="mode-workflow-preview-edge-jb"><path d="M342 258 V281" marker-end="url(#mode-workflow-preview-arrow)"/></g><g class="edge" data-edge="sum" id="mode-workflow-preview-edge-sum"><path d="M220 286 V306" marker-end="url(#mode-workflow-preview-arrow)"/></g><text class="note" x="220" y="228" text-anchor="middle" >并行</text></svg>