<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 462" role="img" aria-labelledby="conversation-title conversation-desc" data-diagram="conversation">
<title id="conversation-title">多轮对话与历史续接</title><desc id="conversation-desc">每轮由用户的新输入触发。第一轮响应被保存为历史，第二轮构造输入时选择相关历史。历史在轮次间传递不等于程序自动启动下一轮。</desc><style>
svg{font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
.bg{fill:var(--diagram-bg,#fff)}
.node .shape{fill:var(--diagram-host,#f3f5f7);stroke:var(--diagram-stroke,#7e8794);stroke-width:1.5}
.node--model .shape{fill:var(--diagram-model,#eaf2fb);stroke:var(--diagram-model-stroke,#36678e);stroke-width:1.8}
.node--tool .shape{fill:var(--diagram-tool,#faf6ed);stroke:var(--diagram-tool-stroke,#9a8458);stroke-width:1.5;stroke-dasharray:5 3}
.node .label{fill:var(--diagram-ink,#24313e);font-weight:550;font-size:20px}
.node .role{fill:var(--diagram-muted,#596677);font-size:13px;letter-spacing:.6px}
.edge path{fill:none;stroke:var(--diagram-edge,#657485);stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.edge .edge-label{fill:var(--diagram-muted,#596677);font-size:16px;paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:5px;stroke-linejoin:round}
.note{fill:var(--diagram-muted,#596677);font-size:15px}
.lane{fill:var(--diagram-bg,#fff);stroke:var(--diagram-line,#cbd2da);stroke-width:1.4;stroke-dasharray:6 4}
.lane-title{fill:var(--diagram-ink,#24313e);font-size:19px;font-weight:600}
.bar{fill:var(--diagram-edge,#657485)}
.node.is-visited .shape{stroke:var(--diagram-active,#146957);stroke-width:2.2}
.node.is-current .shape{fill:var(--diagram-active-fill,#e1f3ec);stroke:var(--diagram-active,#146957);stroke-width:3.5}
.edge.is-visited path{stroke:var(--diagram-active,#146957);stroke-width:3}
.edge.is-current path{stroke:var(--diagram-active,#146957);stroke-width:3.8}
</style><defs><marker id="conversation-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="var(--diagram-edge,#657485)"/></marker></defs><rect class="bg" width="900" height="462"/><text class="lane-title" x="110" y="31" text-anchor="middle" >用户</text><text class="lane-title" x="448" y="31" text-anchor="middle" >程序与会话状态</text><text class="lane-title" x="780" y="31" text-anchor="middle" >模型</text><g class="node node--host" data-node="u1" id="conversation-node-u1"><rect class="shape" x="20" y="70" width="180" height="66" rx="4"/><text class="role" x="110.0" y="90" text-anchor="middle">输入</text><text class="label" style="font-size:20px" x="110.0" y="118.2" text-anchor="middle">第一条问题</text></g><g class="node node--host" data-node="c1" id="conversation-node-c1"><rect class="shape" x="310" y="70" width="276" height="66" rx="4"/><text class="role" x="448.0" y="90" text-anchor="middle">程序</text><text class="label" style="font-size:20px" x="448.0" y="118.2" text-anchor="middle">构造本轮上下文</text></g><g class="node node--model" data-node="m1" id="conversation-node-m1"><rect class="shape" x="695" y="70" width="178" height="66" rx="15"/><text class="role" x="784.0" y="90" text-anchor="middle">LLM</text><text class="label" style="font-size:20px" x="784.0" y="118.2" text-anchor="middle">生成回答</text></g><g class="node node--host" data-node="history" id="conversation-node-history"><rect class="shape" x="310" y="208" width="276" height="63" rx="4"/><text class="role" x="448.0" y="228" text-anchor="middle">会话状态</text><text class="label" style="font-size:20px" x="448.0" y="254.7" text-anchor="middle">保存请求与响应</text></g><g class="node node--host" data-node="u2" id="conversation-node-u2"><rect class="shape" x="20" y="362" width="180" height="66" rx="4"/><text class="role" x="110.0" y="382" text-anchor="middle">新输入</text><text class="label" style="font-size:20px" x="110.0" y="410.2" text-anchor="middle">用户继续追问</text></g><g class="node node--host" data-node="c2" id="conversation-node-c2"><rect class="shape" x="310" y="362" width="276" height="66" rx="4"/><text class="role" x="448.0" y="382" text-anchor="middle">程序</text><text class="label" style="font-size:20px" x="448.0" y="410.2" text-anchor="middle">历史＋新问题</text></g><g class="node node--model" data-node="m2" id="conversation-node-m2"><rect class="shape" x="695" y="362" width="178" height="66" rx="15"/><text class="role" x="784.0" y="382" text-anchor="middle">LLM</text><text class="label" style="font-size:20px" x="784.0" y="410.2" text-anchor="middle">继续回答</text></g><g class="edge" data-edge="u1-c1" id="conversation-edge-u1-c1"><path d="M200 103 H310" marker-end="url(#conversation-arrow)"/></g><g class="edge" data-edge="c1-m1" id="conversation-edge-c1-m1"><path d="M586 103 H695" marker-end="url(#conversation-arrow)"/></g><g class="edge" data-edge="save" id="conversation-edge-save"><path d="M785 136 V240 H586" marker-end="url(#conversation-arrow)"/><text class="edge-label" x="698" y="228" text-anchor="middle">保存响应</text></g><g class="edge" data-edge="reply" id="conversation-edge-reply"><path d="M310 240 H111 V136" marker-end="url(#conversation-arrow)"/><text class="edge-label" x="217" y="225" text-anchor="middle">向用户展示回答</text></g><path d="M15 312 H885" stroke="var(--diagram-line,#cbd2da)" stroke-dasharray="5 5"/><text class="note" x="450" y="305" text-anchor="middle" >等待用户下一次输入；不自动触发后续模型调用</text><g class="edge" data-edge="history-c2" id="conversation-edge-history-c2"><path d="M449 271 V362" marker-end="url(#conversation-arrow)"/><text class="edge-label" x="518" y="344" text-anchor="middle">选择相关历史</text></g><g class="edge" data-edge="u2-c2" id="conversation-edge-u2-c2"><path d="M200 395 H310" marker-end="url(#conversation-arrow)"/></g><g class="edge" data-edge="c2-m2" id="conversation-edge-c2-m2"><path d="M586 395 H695" marker-end="url(#conversation-arrow)"/></g></svg>