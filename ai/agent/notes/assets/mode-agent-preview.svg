<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 335" role="img" aria-labelledby="mode-agent-preview-title mode-agent-preview-desc" data-diagram="mode-agent-preview">
<title id="mode-agent-preview-title">Agent Loop：观察反馈形成闭环</title><desc id="mode-agent-preview-desc">工具执行产生新观察，沿左侧反馈边返回上下文，再由模型提出下一步。答复提议走右侧交付分支。</desc><style>
svg{font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
.bg{fill:var(--diagram-bg,#fff)}
.node .shape{fill:var(--diagram-host,#f3f5f7);stroke:var(--diagram-stroke,#7e8794);stroke-width:1.5}
.node--model .shape{fill:var(--diagram-model,#eaf2fb);stroke:var(--diagram-model-stroke,#36678e);stroke-width:1.8}
.node--tool .shape{fill:var(--diagram-tool,#faf6ed);stroke:var(--diagram-tool-stroke,#9a8458);stroke-width:1.5;stroke-dasharray:5 3}
.node .label{fill:var(--diagram-ink,#24313e);font-weight:550;font-size:20px}
.node .role{fill:var(--diagram-muted,#596677);font-size:13px;letter-spacing:.6px}
.edge path{fill:none;stroke:var(--diagram-edge,#657485);stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.edge .edge-label{fill:var(--diagram-muted,#596677);font-size:16px;paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:5px;stroke-linejoin:round}
.note{fill:var(--diagram-muted,#596677);font-size:15px}
.lane{fill:var(--diagram-bg,#fff);stroke:var(--diagram-line,#cbd2da);stroke-width:1.4;stroke-dasharray:6 4}
.lane-title{fill:var(--diagram-ink,#24313e);font-size:19px;font-weight:600}
.bar{fill:var(--diagram-edge,#657485)}
.node.is-visited .shape{stroke:var(--diagram-active,#146957);stroke-width:2.2}
.node.is-current .shape{fill:var(--diagram-active-fill,#e1f3ec);stroke:var(--diagram-active,#146957);stroke-width:3.5}
.edge.is-visited path{stroke:var(--diagram-active,#146957);stroke-width:3}
.edge.is-current path{stroke:var(--diagram-active,#146957);stroke-width:3.8}
</style><defs><marker id="mode-agent-preview-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="var(--diagram-edge,#657485)"/></marker></defs><rect class="bg" width="440" height="335"/><g class="node node--host" data-node="context" id="mode-agent-preview-node-context"><rect class="shape" x="123" y="9" width="178" height="53" rx="4"/><text class="role" x="212.0" y="29" text-anchor="middle">程序</text><text class="label" style="font-size:18px" x="212.0" y="50.18000000000001" text-anchor="middle">当前上下文</text></g><g class="node node--model" data-node="model" id="mode-agent-preview-node-model"><rect class="shape" x="138" y="103" width="148" height="61" rx="15"/><text class="role" x="212.0" y="123" text-anchor="middle">LLM</text><text class="label" style="font-size:19px" x="212.0" y="148.44" text-anchor="middle">判断下一步</text></g><g class="node node--host" data-node="kind" id="mode-agent-preview-node-kind"><polygon class="shape" points="212,184.0 262.0,219 212,254.0 162.0,219"/><text class="label" style="font-size:17px" x="212" y="214" text-anchor="middle">响应</text><text class="label" style="font-size:17px" x="212" y="236" text-anchor="middle">类型</text></g><g class="node node--tool" data-node="tool" id="mode-agent-preview-node-tool"><rect class="shape" x="116" y="284" width="192" height="49" rx="4"/><text class="label" style="font-size:17px" x="212.0" y="313.6" text-anchor="middle">执行工具 → 新观察</text></g><g class="node node--host" data-node="finish" id="mode-agent-preview-node-finish"><rect class="shape" x="330" y="195" width="98" height="56" rx="4"/><text class="role" x="379.0" y="215" text-anchor="middle">程序</text><text class="label" style="font-size:16px" x="379.0" y="237.16" text-anchor="middle">核对交付</text></g><g class="edge" data-edge="request" id="mode-agent-preview-edge-request"><path d="M212 62 V103" marker-end="url(#mode-agent-preview-arrow)"/></g><g class="edge" data-edge="decision" id="mode-agent-preview-edge-decision"><path d="M212 164 V184" marker-end="url(#mode-agent-preview-arrow)"/></g><g class="edge" data-edge="action" id="mode-agent-preview-edge-action"><path d="M212 254 V284" marker-end="url(#mode-agent-preview-arrow)"/></g><g class="edge" data-edge="candidate" id="mode-agent-preview-edge-candidate"><path d="M262 219 H330" marker-end="url(#mode-agent-preview-arrow)"/><text class="edge-label" x="295" y="206" text-anchor="middle">答复</text></g><g class="edge" data-edge="feedback" id="mode-agent-preview-edge-feedback"><path d="M116 309 H51 V36 H123" marker-end="url(#mode-agent-preview-arrow)"/></g><text class="note" x="74" y="179" text-anchor="middle" >反馈</text></svg>