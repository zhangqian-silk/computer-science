<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 682" role="img" aria-labelledby="interaction-mobile-title interaction-mobile-desc" data-diagram="interaction-mobile">
<title id="interaction-mobile-title">单次模型交互</title><desc id="interaction-mobile-desc">输入、一次模型调用和响应内容纵向排列，适合窄屏。</desc><style>
svg{font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
.bg{fill:var(--diagram-bg,#fff)}
.node .shape{fill:var(--diagram-host,#f3f5f7);stroke:var(--diagram-stroke,#7e8794);stroke-width:1.5}
.node--model .shape{fill:var(--diagram-model,#eaf2fb);stroke:var(--diagram-model-stroke,#36678e);stroke-width:1.8}
.node--tool .shape{fill:var(--diagram-tool,#faf6ed);stroke:var(--diagram-tool-stroke,#9a8458);stroke-width:1.5;stroke-dasharray:5 3}
.node .label{fill:var(--diagram-ink,#24313e);font-weight:550;font-size:20px}
.node .role{fill:var(--diagram-muted,#596677);font-size:13px;letter-spacing:.6px}
.edge path{fill:none;stroke:var(--diagram-edge,#657485);stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.edge .edge-label{fill:var(--diagram-muted,#596677);font-size:16px;paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:5px;stroke-linejoin:round}
.note{fill:var(--diagram-muted,#596677);font-size:15px}
.lane{fill:var(--diagram-bg,#fff);stroke:var(--diagram-line,#cbd2da);stroke-width:1.4;stroke-dasharray:6 4}
.lane-title{fill:var(--diagram-ink,#24313e);font-size:19px;font-weight:600}
.bar{fill:var(--diagram-edge,#657485)}
.node.is-visited .shape{stroke:var(--diagram-active,#146957);stroke-width:2.2}
.node.is-current .shape{fill:var(--diagram-active-fill,#e1f3ec);stroke:var(--diagram-active,#146957);stroke-width:3.5}
.edge.is-visited path{stroke:var(--diagram-active,#146957);stroke-width:3}
.edge.is-current path{stroke:var(--diagram-active,#146957);stroke-width:3.8}
</style><defs><marker id="interaction-mobile-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="var(--diagram-edge,#657485)"/></marker></defs><rect class="bg" width="420" height="682"/><rect class="lane" x="12" y="12" width="396" height="221" rx="7"/><text class="lane-title" x="30" y="41" text-anchor="start" >请求输入</text><text class="note" x="31" y="75" text-anchor="start" style="font-size:17px">指令：System / Developer</text><text class="note" x="31" y="115" text-anchor="start" style="font-size:17px">任务：用户问题与要求</text><text class="note" x="31" y="155" text-anchor="start" style="font-size:17px">资料：附件、RAG、历史</text><text class="note" x="31" y="195" text-anchor="start" style="font-size:17px">能力：工具说明、Skill 内容</text><g class="node node--model" data-node="model" id="interaction-mobile-node-model"><rect class="shape" x="85" y="285" width="250" height="86" rx="15"/><text class="role" x="210.0" y="305" text-anchor="middle">LLM</text><text class="label" style="font-size:20px" x="210.0" y="343.2" text-anchor="middle">一次模型调用</text></g><rect class="lane" x="12" y="425" width="396" height="240" rx="7"/><text class="lane-title" x="30" y="454" text-anchor="start" >响应内容</text><text class="note" x="31" y="490" text-anchor="start" style="font-size:16px">文本与结构化结果 → 展示或校验</text><text class="note" x="31" y="535" text-anchor="start" style="font-size:16px">推理相关条目 → 按接口保留</text><text class="note" x="31" y="580" text-anchor="start" style="font-size:16px">工具调用 → 程序校验并执行</text><text class="note" x="31" y="631" text-anchor="start" style="font-size:16px">完整性与结束状态：单独判断</text><g class="edge" data-edge="request" id="interaction-mobile-edge-request"><path d="M210 233 V285" marker-end="url(#interaction-mobile-arrow)"/></g><g class="edge" data-edge="response" id="interaction-mobile-edge-response"><path d="M210 371 V425" marker-end="url(#interaction-mobile-arrow)"/></g></svg>