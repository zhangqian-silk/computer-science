<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 762" role="img" aria-labelledby="multi-agent-mobile-title multi-agent-mobile-desc" data-diagram="multi-agent-mobile">
<title id="multi-agent-mobile-title">多 Agent 的并行委派</title><desc id="multi-agent-mobile-desc">主程序或主 Agent 向两个独立上下文中的 Agent 分派工作。两个框上下排列仅适应手机屏幕，不表示串行。左右外围连接线表示分派和汇总。</desc><style>
svg{font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
.bg{fill:var(--diagram-bg,#fff)}
.node .shape{fill:var(--diagram-host,#f3f5f7);stroke:var(--diagram-stroke,#7e8794);stroke-width:1.5}
.node--model .shape{fill:var(--diagram-model,#eaf2fb);stroke:var(--diagram-model-stroke,#36678e);stroke-width:1.8}
.node--tool .shape{fill:var(--diagram-tool,#faf6ed);stroke:var(--diagram-tool-stroke,#9a8458);stroke-width:1.5;stroke-dasharray:5 3}
.node .label{fill:var(--diagram-ink,#24313e);font-weight:550;font-size:20px}
.node .role{fill:var(--diagram-muted,#596677);font-size:13px;letter-spacing:.6px}
.edge path{fill:none;stroke:var(--diagram-edge,#657485);stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.edge .edge-label{fill:var(--diagram-muted,#596677);font-size:16px;paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:5px;stroke-linejoin:round}
.note{fill:var(--diagram-muted,#596677);font-size:15px}
.lane{fill:var(--diagram-bg,#fff);stroke:var(--diagram-line,#cbd2da);stroke-width:1.4;stroke-dasharray:6 4}
.lane-title{fill:var(--diagram-ink,#24313e);font-size:19px;font-weight:600}
.bar{fill:var(--diagram-edge,#657485)}
.node.is-visited .shape{stroke:var(--diagram-active,#146957);stroke-width:2.2}
.node.is-current .shape{fill:var(--diagram-active-fill,#e1f3ec);stroke:var(--diagram-active,#146957);stroke-width:3.5}
.edge.is-visited path{stroke:var(--diagram-active,#146957);stroke-width:3}
.edge.is-current path{stroke:var(--diagram-active,#146957);stroke-width:3.8}
</style><defs><marker id="multi-agent-mobile-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="var(--diagram-edge,#657485)"/></marker></defs><rect class="bg" width="420" height="762"/><g class="node node--host" data-node="coordinator" id="multi-agent-mobile-node-coordinator"><rect class="shape" x="83" y="14" width="254" height="65" rx="4"/><text class="role" x="210.0" y="34" text-anchor="middle">程序或主 Agent</text><text class="label" style="font-size:20px" x="210.0" y="61.7" text-anchor="middle">拆分与委派</text></g><text class="note" x="210" y="119" text-anchor="middle" style="font-size:15px">可并行执行；上下位置不表示先后</text><rect class="lane" x="22" y="152" width="376" height="203" rx="7"/><text class="lane-title" x="40" y="181" text-anchor="start" >Agent A · 独立上下文</text><g class="node node--model" data-node="a-model" id="multi-agent-mobile-node-a-model"><rect class="shape" x="42" y="207" width="139" height="61" rx="15"/><text class="role" x="111.5" y="227" text-anchor="middle">LLM</text><text class="label" style="font-size:19px" x="111.5" y="252.44" text-anchor="middle">选择动作</text></g><g class="node node--tool" data-node="a-tool" id="multi-agent-mobile-node-a-tool"><rect class="shape" x="236" y="207" width="139" height="61" rx="4"/><text class="role" x="305.5" y="227" text-anchor="middle">工具</text><text class="label" style="font-size:19px" x="305.5" y="252.44" text-anchor="middle">执行工具</text></g><g class="edge" data-edge="a-call" id="multi-agent-mobile-edge-a-call"><path d="M181 238 H236" marker-end="url(#multi-agent-mobile-arrow)"/></g><g class="edge" data-edge="a-feedback" id="multi-agent-mobile-edge-a-feedback"><path d="M305 268 V317 H112 V268" marker-end="url(#multi-agent-mobile-arrow)"/></g><text class="note" x="210" y="339" text-anchor="middle" >观察反馈</text><rect class="lane" x="22" y="419" width="376" height="203" rx="7"/><text class="lane-title" x="40" y="448" text-anchor="start" >Agent B · 独立上下文</text><g class="node node--model" data-node="b-model" id="multi-agent-mobile-node-b-model"><rect class="shape" x="42" y="474" width="139" height="61" rx="15"/><text class="role" x="111.5" y="494" text-anchor="middle">LLM</text><text class="label" style="font-size:19px" x="111.5" y="519.44" text-anchor="middle">选择动作</text></g><g class="node node--tool" data-node="b-tool" id="multi-agent-mobile-node-b-tool"><rect class="shape" x="236" y="474" width="139" height="61" rx="4"/><text class="role" x="305.5" y="494" text-anchor="middle">工具</text><text class="label" style="font-size:19px" x="305.5" y="519.44" text-anchor="middle">执行工具</text></g><g class="edge" data-edge="b-call" id="multi-agent-mobile-edge-b-call"><path d="M181 505 H236" marker-end="url(#multi-agent-mobile-arrow)"/></g><g class="edge" data-edge="b-feedback" id="multi-agent-mobile-edge-b-feedback"><path d="M305 535 V584 H112 V535" marker-end="url(#multi-agent-mobile-arrow)"/></g><text class="note" x="210" y="606" text-anchor="middle" >观察反馈</text><g class="node node--host" data-node="integrate" id="multi-agent-mobile-node-integrate"><rect class="shape" x="83" y="690" width="254" height="65" rx="4"/><text class="role" x="210.0" y="710" text-anchor="middle">程序</text><text class="label" style="font-size:20px" x="210.0" y="737.7" text-anchor="middle">汇总与全局验证</text></g><g class="edge" data-edge="delegate-a" id="multi-agent-mobile-edge-delegate-a"><path d="M135 79 V133 H8 V221 H22" marker-end="url(#multi-agent-mobile-arrow)"/></g><g class="edge" data-edge="delegate-b" id="multi-agent-mobile-edge-delegate-b"><path d="M8 221 V488 H22" marker-end="url(#multi-agent-mobile-arrow)"/></g><g class="edge" data-edge="result-a" id="multi-agent-mobile-edge-result-a"><path d="M398 280 H411 V667 H280 V690" marker-end="url(#multi-agent-mobile-arrow)"/></g><g class="edge" data-edge="result-b" id="multi-agent-mobile-edge-result-b"><path d="M398 547 H411" marker-end="url(#multi-agent-mobile-arrow)"/></g></svg>