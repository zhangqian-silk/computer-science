<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 650" role="img" aria-labelledby="mode-agent-title mode-agent-desc" data-diagram="mode-agent">
<title id="mode-agent-title">观察驱动循环</title><desc id="mode-agent-desc">模型依据当前上下文提出动作，程序解析响应。工具调用经校验执行后形成新观察，反馈给下一次模型调用；答复提议进入程序验证与交付。模型可以首轮直接作答，也可以重复工具反馈循环。</desc><style>
svg{font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
.bg{fill:var(--diagram-bg,#fff)}
.node .shape{fill:var(--diagram-host,#f3f5f7);stroke:var(--diagram-stroke,#7e8794);stroke-width:1.5}
.node--model .shape{fill:var(--diagram-model,#eaf2fb);stroke:var(--diagram-model-stroke,#36678e);stroke-width:1.8}
.node--tool .shape{fill:var(--diagram-tool,#faf6ed);stroke:var(--diagram-tool-stroke,#9a8458);stroke-width:1.5;stroke-dasharray:5 3}
.node .label{fill:var(--diagram-ink,#24313e);font-weight:550;font-size:20px}
.node .role{fill:var(--diagram-muted,#596677);font-size:13px;letter-spacing:.6px}
.edge path{fill:none;stroke:var(--diagram-edge,#657485);stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.edge .edge-label{fill:var(--diagram-muted,#596677);font-size:16px;paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:5px;stroke-linejoin:round}
.note{fill:var(--diagram-muted,#596677);font-size:15px}
.lane{fill:var(--diagram-bg,#fff);stroke:var(--diagram-line,#cbd2da);stroke-width:1.4;stroke-dasharray:6 4}
.lane-title{fill:var(--diagram-ink,#24313e);font-size:19px;font-weight:600}
.bar{fill:var(--diagram-edge,#657485)}
.node.is-visited .shape{stroke:var(--diagram-active,#146957);stroke-width:2.2}
.node.is-current .shape{fill:var(--diagram-active-fill,#e1f3ec);stroke:var(--diagram-active,#146957);stroke-width:3.5}
.edge.is-visited path{stroke:var(--diagram-active,#146957);stroke-width:3}
.edge.is-current path{stroke:var(--diagram-active,#146957);stroke-width:3.8}
</style><defs><marker id="mode-agent-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="var(--diagram-edge,#657485)"/></marker></defs><rect class="bg" width="520" height="650"/><g class="node node--host" data-node="context" id="mode-agent-node-context"><rect class="shape" x="110" y="25" width="250" height="75" rx="4"/><text class="role" x="235.0" y="45" text-anchor="middle">程序</text><text class="label" style="font-size:20px" x="235.0" y="77.7" text-anchor="middle">目标与当前上下文</text></g><g class="node node--model" data-node="model" id="mode-agent-node-model"><rect class="shape" x="125" y="151" width="220" height="76" rx="15"/><text class="role" x="235.0" y="171" text-anchor="middle">LLM</text><text class="label" style="font-size:20px" x="235.0" y="204.2" text-anchor="middle">判断下一步</text></g><g class="node node--host" data-node="kind" id="mode-agent-node-kind"><polygon class="shape" points="235,261.0 315.0,310 235,359.0 155.0,310"/><text class="label" style="font-size:17px" x="235" y="305" text-anchor="middle">程序解析</text><text class="label" style="font-size:17px" x="235" y="327" text-anchor="middle">响应类型</text></g><g class="node node--tool" data-node="tool" id="mode-agent-node-tool"><rect class="shape" x="110" y="418" width="250" height="76" rx="4"/><text class="role" x="235.0" y="438" text-anchor="middle">程序 → 工具</text><text class="label" style="font-size:20px" x="235.0" y="471.2" text-anchor="middle">校验并执行工具</text></g><g class="node node--host" data-node="observe" id="mode-agent-node-observe"><rect class="shape" x="110" y="550" width="250" height="70" rx="4"/><text class="role" x="235.0" y="570" text-anchor="middle">程序</text><text class="label" style="font-size:20px" x="235.0" y="600.2" text-anchor="middle">保存结果与新观察</text></g><g class="node node--host" data-node="finish" id="mode-agent-node-finish"><rect class="shape" x="383" y="413" width="124" height="97" rx="4"/><text class="role" x="445.0" y="433" text-anchor="middle">程序</text><text class="label" style="font-size:19px" x="445.0" y="465.03999999999996" text-anchor="middle">核对与</text><text class="label" style="font-size:19px" x="445.0" y="487.84" text-anchor="middle">交付</text></g><g class="edge" data-edge="request" id="mode-agent-edge-request"><path d="M235 100 V151" marker-end="url(#mode-agent-arrow)"/></g><g class="edge" data-edge="decision" id="mode-agent-edge-decision"><path d="M235 227 V261" marker-end="url(#mode-agent-arrow)"/></g><g class="edge" data-edge="tool-call" id="mode-agent-edge-tool-call"><path d="M235 359 V418" marker-end="url(#mode-agent-arrow)"/><text class="edge-label" x="275" y="393" text-anchor="middle">工具调用</text></g><g class="edge" data-edge="observe" id="mode-agent-edge-observe"><path d="M235 494 V550" marker-end="url(#mode-agent-arrow)"/></g><g class="edge" data-edge="feedback" id="mode-agent-edge-feedback"><path d="M110 585 H43 V64 H110" marker-end="url(#mode-agent-arrow)"/></g><text class="note" x="24" y="365" text-anchor="middle" transform="rotate(-90 24 365)">更新上下文，再次请求模型</text><g class="edge" data-edge="candidate" id="mode-agent-edge-candidate"><path d="M315 310 H445 V413" marker-end="url(#mode-agent-arrow)"/><text class="edge-label" x="422" y="296" text-anchor="middle">答复提议</text></g><g class="edge" data-edge="end" id="mode-agent-edge-end"><path d="M445 510 V576" marker-end="url(#mode-agent-arrow)"/></g><text class="note" x="445" y="607" text-anchor="middle" >结束本次运行</text></svg>