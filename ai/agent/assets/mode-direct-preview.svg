<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 260" role="img" aria-labelledby="mode-direct-preview-title mode-direct-preview-desc" data-diagram="mode-direct-preview">
<title id="mode-direct-preview-title">单次生成：无反馈边</title><desc id="mode-direct-preview-desc">输入交给一次模型调用，输出由程序处理并返回。</desc><style>
svg{font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
.bg{fill:var(--diagram-bg,#fff)}
.node .shape{fill:var(--diagram-host,#f3f5f7);stroke:var(--diagram-stroke,#7e8794);stroke-width:1.5}
.node--model .shape{fill:var(--diagram-model,#eaf2fb);stroke:var(--diagram-model-stroke,#36678e);stroke-width:1.8}
.node--tool .shape{fill:var(--diagram-tool,#faf6ed);stroke:var(--diagram-tool-stroke,#9a8458);stroke-width:1.5;stroke-dasharray:5 3}
.node .label{fill:var(--diagram-ink,#24313e);font-weight:550;font-size:20px}
.node .role{fill:var(--diagram-muted,#596677);font-size:13px;letter-spacing:.6px}
.edge path{fill:none;stroke:var(--diagram-edge,#657485);stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.edge .edge-label{fill:var(--diagram-muted,#596677);font-size:16px;paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:5px;stroke-linejoin:round}
.note{fill:var(--diagram-muted,#596677);font-size:15px}
.lane{fill:var(--diagram-bg,#fff);stroke:var(--diagram-line,#cbd2da);stroke-width:1.4;stroke-dasharray:6 4}
.lane-title{fill:var(--diagram-ink,#24313e);font-size:19px;font-weight:600}
.bar{fill:var(--diagram-edge,#657485)}
.node.is-visited .shape{stroke:var(--diagram-active,#146957);stroke-width:2.2}
.node.is-current .shape{fill:var(--diagram-active-fill,#e1f3ec);stroke:var(--diagram-active,#146957);stroke-width:3.5}
.edge.is-visited path{stroke:var(--diagram-active,#146957);stroke-width:3}
.edge.is-current path{stroke:var(--diagram-active,#146957);stroke-width:3.8}
</style><defs><marker id="mode-direct-preview-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="var(--diagram-edge,#657485)"/></marker></defs><rect class="bg" width="440" height="260"/><g class="node node--host" data-node="input" id="mode-direct-preview-node-input"><rect class="shape" x="15" y="92" width="111" height="71" rx="4"/><text class="role" x="70.5" y="112" text-anchor="middle">程序</text><text class="label" style="font-size:18px" x="70.5" y="142.18" text-anchor="middle">已有输入</text></g><g class="node node--model" data-node="model" id="mode-direct-preview-node-model"><rect class="shape" x="172" y="83" width="110" height="89" rx="15"/><text class="role" x="227.0" y="103" text-anchor="middle">LLM × 1</text><text class="label" style="font-size:20px" x="227.0" y="142.7" text-anchor="middle">生成</text></g><g class="node node--host" data-node="return" id="mode-direct-preview-node-return"><rect class="shape" x="329" y="92" width="96" height="71" rx="4"/><text class="role" x="377.0" y="112" text-anchor="middle">程序</text><text class="label" style="font-size:18px" x="377.0" y="142.18" text-anchor="middle">返回</text></g><g class="edge" data-edge="ask" id="mode-direct-preview-edge-ask"><path d="M126 128 H172" marker-end="url(#mode-direct-preview-arrow)"/></g><g class="edge" data-edge="deliver" id="mode-direct-preview-edge-deliver"><path d="M282 128 H329" marker-end="url(#mode-direct-preview-arrow)"/></g><text class="note" x="220" y="227" text-anchor="middle" >无工具执行 · 无反馈边</text></svg>